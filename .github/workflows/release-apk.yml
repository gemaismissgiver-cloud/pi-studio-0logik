name: Release Management & Motorola 13 APK Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (z.B. v5.2.0)'
        required: true
        default: 'v5.2.0'

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Motorola 13 Package Assets
        run: |
          mkdir -p build/apk-release
          echo "Package: com.missgiver.pi0logik" > build/apk-release/build-info.txt
          echo "Target: Motorola 13 (Android 13/14)" >> build/apk-release/build-info.txt
          echo "Build Timestamp: $(date -u)" >> build/apk-release/build-info.txt
          cp public/icon-512.png build/apk-release/icon.png
          # Create distributable package archive
          tar -czf build/apk-release/pi-studio-motorola13-standalone.tar.gz dist/

      - name: Upload Motorola 13 & Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motorola13-build-package
          path: |
            build/apk-release/*
            pi_core_v5.py
            pi_transformer_studio.py
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v5.2.0' }}
          name: PI Studio Release ${{ github.ref_name || inputs.version || 'v5.2.0' }}
          body: |
            ## 0-Logik Release ${{ github.ref_name || inputs.version || 'v5.2.0' }}
            - Motorola 13 PWA & Standalone Bundle
            - 9 Core Tools einsatzbereit
            - Transformer Studio LoRA Adapter
            - Guardian Integritätsschutz aktiv
          files: |
            build/apk-release/*
            pi_core_v5.py
            pi_transformer_studio.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
