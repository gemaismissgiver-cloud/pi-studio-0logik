<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Zero Coordinate Ring (0-Logik) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="14" stroke-dasharray="12 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.8"/>

  <!-- Polarity Axis (- 0 +) -->
  <line x1="86" y1="256" x2="156" y2="256" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <text x="120" y="246" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">-</text>

  <line x1="356" y1="256" x2="426" y2="256" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
  <text x="390" y="246" fill="#a855f7" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">+</text>

  <!-- Central 0 Symbol & PI Monogram -->
  <ellipse cx="256" cy="256" rx="64" ry="86" fill="none" stroke="#ffffff" stroke-width="12"/>
  <circle cx="256" cy="256" r="16" fill="#06b6d4"/>

  <!-- PI Label -->
  <text x="256" y="420" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="32" font-weight="700" letter-spacing="8" text-anchor="middle">PI · 0-LOGIK</text>
</svg>
